# AskTrabaajo — staging/production container stack (canonical backend).
#
# Phase 12 hardening:
#  - Every secret comes from the environment / local .env (never hardcoded).
#    Required secrets fail fast with a clear error when missing.
#  - Only services that can actually boot are included. The legacy
#    frontend container (no Dockerfile), prometheus/grafana (missing
#    configs), and the nginx TLS edge (missing certificates) were removed —
#    see PHASE_12_PRODUCTION_INFRASTRUCTURE.md, section "Deployment stack".
#  - The backend runs the CANONICAL FastAPI app (backend/app) — the
#    image's default CMD targets the legacy MVP app, so the command is
#    overridden here.
#
# Usage:
#   cp docker-compose.env.example .env      # then fill in real values
#   docker compose up -d
#
# For a hosted PostgreSQL (e.g. Supabase), skip the `postgres` service and
# point DATABASE_URL at the managed instance instead.

services:
  postgres:
    image: postgres:15
    container_name: asktrabaajo_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asktrabaajo}
      POSTGRES_USER: ${POSTGRES_USER:-asktrabaajo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-asktrabaajo} -d ${POSTGRES_DB:-asktrabaajo}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asktrabaajo_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: asktrabaajo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asktrabaajo_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asktrabaajo-backend:latest
    container_name: asktrabaajo_backend
    # Run the canonical FastAPI app (backend/app/main.py -> app.main:app).
    # The image default CMD (`main:app`) boots the legacy MVP backend.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://asktrabaajo.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - asktrabaajo_network
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/asktrabaajo

volumes:
  postgres_data:
  redis_data:

networks:
  asktrabaajo_network:
    driver: bridge