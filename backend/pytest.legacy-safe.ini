[tool:pytest]
# Safe harness for the LEGACY test suite during the migration (backend/tests).
#
# IMPORTANT: always run with a throwaway database so the legacy suite can
# never touch the live/production database:
#
#   DATABASE_URL="sqlite:////tmp/legacy_safe.db" \
#       .venv/bin/python -m pytest -c pytest.legacy-safe.ini tests
#
# (Legacy code reads DATABASE_URL at import time; the env var must therefore
# be set before pytest starts. load_dotenv() never overrides existing env
# variables, so this override is authoritative.)
#
# This config deliberately has no --cov addopts (pytest-cov is not required)
# and no markers config.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
