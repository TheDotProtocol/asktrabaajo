# Alembic configuration for the AskTrabaajo canonical schema.
#
# sqlalchemy.url is intentionally NOT set here — env.py resolves the URL from
# the centralized settings (DATABASE_URL). Never commit real URLs.
[alembic]
script_location = alembic
prepend_sys_path = .
# render_as_batch=True keeps autogenerated migrations compatible with SQLite
# (used for local validation only; production target is PostgreSQL).
render_as_batch = True
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
